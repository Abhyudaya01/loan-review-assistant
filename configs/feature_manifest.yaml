    description: "Application goods price; source dtype is recorded at runtime."
  - name: "DAYS_EMPLOYED_SENTINEL"
    source: "application_train.csv:DAYS_EMPLOYED"
    dtype: "Int8"
    description: "1 when original DAYS_EMPLOYED equals 365243."
  - name: "PAYMENT_TO_INCOME"
    source: "application_train.csv:AMT_ANNUITY,AMT_INCOME_TOTAL"
    dtype: "Float64"
    description: "AMT_ANNUITY/AMT_INCOME_TOTAL; invalid or nonpositive denominator is null."
  - name: "CREDIT_TO_INCOME"
    source: "application_train.csv:AMT_CREDIT,AMT_INCOME_TOTAL"
    dtype: "Float64"
    description: "AMT_CREDIT/AMT_INCOME_TOTAL; invalid or nonpositive denominator is null."
