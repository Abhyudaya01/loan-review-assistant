# Pre-data catalog, not a fitted dataset manifest.
# The three source CSVs are not yet present in data/raw/.
# A successful pipeline run replaces this with the exact emitted feature list,
# observed dtypes, and content-derived artifact version. Additional unprotected
# application columns pass through and appear in that runtime manifest.
# Optional history statistics are emitted only when their source column exists.
status: "catalog_pending_source_data"
version: "catalog-v1.0.0"
pipeline_version: "1.0.0"
features:
  - name: "DAYS_EMPLOYED"
    source: "application_train.csv"
    dtype: "Float64"
    description: "Days employed; the 365243 sentinel is replaced with NaN."
  - name: "AMT_ANNUITY"
    source: "application_train.csv"
    dtype: "Float64"
    description: "Application loan annuity amount; source dtype is recorded at runtime."
  - name: "AMT_INCOME_TOTAL"
    source: "application_train.csv"
    dtype: "Float64"
    description: "Application total income; source dtype is recorded at runtime."
